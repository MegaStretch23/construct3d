<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
html,body{margin:0;height:100%;background:#14181f;color:#dde3ee;font:14px system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:260px;padding:12px;box-sizing:border-box;overflow:auto;background:#1a2029;border-right:1px solid #2a3140}
#side h1{font-size:16px;margin:0 0 8px}
#list{list-style:none;margin:8px 0;padding:0}
#list li{padding:5px 8px;border-radius:5px;cursor:pointer}
#list li:hover{background:#252d3a}#list li.on{background:#31507a}
#info{border-top:1px solid #2a3140;margin-top:8px;padding-top:8px;word-break:break-word}
#info h2{font-size:15px;margin:0 0 4px}#info p{margin:4px 0;color:#aab4c4}#info a{color:#7fb2ff}
label{display:block;margin:8px 0 2px;color:#aab4c4}input[type=range]{width:100%}
button{margin-top:8px;background:#2a3140;color:#dde3ee;border:1px solid #3a4456;border-radius:5px;padding:4px 10px;cursor:pointer}
#c{flex:1;min-width:0;height:100%;display:block;touch-action:none}
.hint{color:#7d8798;font-size:12px;margin-top:10px}
</style></head><body>
<div id="app"><div id="side"><h1>__TITLE__</h1><div id="count">__COUNT__</div><ul id="list"></ul>
<label for="explode">Explode parts</label><input id="explode" type="range" min="0" max="100" value="0">
<label><input id="wire" type="checkbox"> Wireframe</label><button id="reset">Reset view</button>
<div id="info"></div><div class="hint">Drag: rotate. Shift-drag or right-drag: pan. Wheel: zoom. Click: select.</div></div>
<canvas id="c"></canvas></div>
<script type="application/json" id="scene-data">__SCENE__</script>
<script type="text/plain" id="three-src">__THREE__</script>
<script type="text/plain" id="core-src">__CORE__</script>
<script type="module">
const blob = id => URL.createObjectURL(new Blob([document.getElementById(id).textContent], { type: "text/javascript" }));
try {
  const THREE = await import(blob("three-src"));
  const core = await import(blob("core-src"));
  core.start(THREE, JSON.parse(document.getElementById("scene-data").textContent), document);
} catch (e) {
  document.getElementById("info").textContent = "Viewer failed to start (WebGL needed): " + e.message;
}
</script></body></html>
